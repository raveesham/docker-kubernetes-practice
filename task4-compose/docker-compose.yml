services:

  nginx:
    image: nginx:alpine
    ports:
      - "8086:80"

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: appdb
    volumes:
      - mysql-compose-data:/var/lib/mysql

  redis:
    image: redis:alpine

volumes:
  mysql-compose-data:
